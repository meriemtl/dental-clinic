# ---------------------------------------------------------------
#  Dental Clinic Management System - configuration
#  Edit the values below, then restart the application.
# ---------------------------------------------------------------

# MySQL server (the database and all tables are created automatically)
db.host=localhost
db.port=3306
db.name=dental_clinic
db.user=root
db.password=enter your sql password
# Clinic information shown in the application
clinic.name=Dental Clinic
currency=DA

# Agenda: opening hours and time-slot size (minutes)
agenda.start=08:00
agenda.end=18:00
agenda.slot=15

# On the very first start, insert a few demo patients and appointments.
# Set to false if you want an empty database.
app.sample-data=true
